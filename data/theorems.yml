  - id: chapter2_foundations
    dissertation_ref: "Cor. 2.46 & Defs. 2.12, 2.47, 2.51, 2.56, 2.61"
    title: "k-Component Direct Product, Root System, Signature Classification, Node Deletion & Spectral Radius"
    statement: "If a reflection diagram has k disconnected components, W(Gamma) is isomorphic to the direct product of its k component subgroups; plus full definitions of roots Phi, eigenvalue signature (p,q,l), 4-way classification (spherical/affine/hyperbolic/higher-rank), node deletion Gamma/(r_i), and spectral radius lambda(w)."
