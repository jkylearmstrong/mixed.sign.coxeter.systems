    dissertation_ref: "Example 3.33"
    title: "6-Node Bipartite Mixed-Sign Benchmark"
    statement: "The 6-node, 7-edge bipartite graph Example 3.33 exhibits distinct linear and bipartite principal spectral radii."
    lean_symbol: "theorem_3_34_bipartite_exceeds_linear"
