    preset: "a3_ppm"

  - id: appendix_d_relators
    dissertation_ref: "Appendix D"
    title: "16 GAP Relators for W(~A_{-4})"
    statement: "The 5 integer reflection matrices of W(~A_{-4}) satisfy all 16 GAP presentation relators (yielding a group isomorphic to W(D_5) of order 1920)."
    lean_symbol: "appendixD_relators_hold"
    lean_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/lean/MixedSignCoxeter/TildeAminusEvenIso.lean#L528"
