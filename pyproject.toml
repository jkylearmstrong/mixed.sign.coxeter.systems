[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-sign-coxeter"
version = "0.1.0"
description = "Python library for reflection systems and mixed-sign Coxeter systems (supporting Armstrong 2012)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "sympy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
manim = [
    "manim>=0.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

