    status: "Verified (Lean 4 + Python)"
    preset: "a_tilde_minus_2"

  - id: appendix_a_finite_reduction
    dissertation_ref: "Appendix A / Rem. A.3 & Cor. 3.18"
    title: "Connected Finite Reflection Groups Have Definite Forms"
    statement: "If a connected reflection system generates a finite group, its bilinear form B is definite (positive or negative); hence any connected mixed-sign system with both + and - nodes generates an infinite group."
    lean_symbol: "finite_connected_isDefinite"
    lean_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/lean/MixedSignCoxeter/FiniteReduction.lean#L193"
