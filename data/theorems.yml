    python_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/src/mixed_sign_coxeter/principal_search.py#L240"
    status: "Verified (Lean 4 + Python)"
    preset: "a_n_alt_4"

  - id: odd_cycle_single_defect
    dissertation_ref: "General C_{2m+1}(+,-,...,-)"
    title: "Single-Defect Odd Cycle Minimal Polynomial & Spectral Radius"
    statement: "For every m >= 1, the principal element w of C_{2m+1}(+,-,...,-) satisfies (w + I)^2 (w^(2m) - I) = 0 with (w + I)(w^(2m) - I) != 0, so every real eigenvalue is +-1."
    lean_symbol: "oddCycleSinglePlus_minimal_poly"
    lean_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/lean/MixedSignCoxeter/OddCycleSingleDefect.lean"
    python_ref: "principal_search.cycle_radius_by_circulation"
    python_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/src/mixed_sign_coxeter/principal_search.py#L251"
    status: "Verified (Lean 4 + Python)"
    preset: "a_n_alt_4"

  - id: even_cycle_single_defect
    dissertation_ref: "General C_{2m}(+,-,...,-)"
    title: "Single-Defect Even Cycle Hyperbolic Eigenvalue"
    statement: "For every m >= 2, the principal element w of C_{2m}(+,-,...,-) has det(-I - w) = -4 < 0 and det(-5I - w) > 0, so it has a real eigenvalue lambda in (-5, -1) and spectral radius rho(w) > 1."
    lean_symbol: "evenCycleSinglePlus_has_eigenvalue_lt_neg_one"
    lean_url: "https://github.com/jkylearmstrong/mixed.signed.coxeter.systems/blob/main/lean/MixedSignCoxeter/EvenCycleSingleDefect.lean"
    python_ref: "principal_search.cycle_radius_by_circulation"
    python_url: "https://github.com/jkylearmstrong/mixed.signed.coxeter.systems/blob/main/src/mixed_sign_coxeter/principal_search.py#L251"
    status: "Verified (Lean 4 + Python)"
    preset: "a_n_alt_4"


  - id: bipartite_sign_flip_duality
    dissertation_ref: "General Bipartite Duality"
    title: "Bipartite Sign-Flip Conjugation & Duality"
    statement: "On any bipartite reflection system, flipping all vertex signs conjugates the principal element w by D = diag(+-1), preserving det(mu I - w) and eigenvalues; hence C_{2m}(-,+,...,+) also has a real eigenvalue < -1."
    lean_symbol: "principalElement_bipartiteSignFlip"
    lean_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/lean/MixedSignCoxeter/BipartiteDuality.lean"
    python_ref: "principal_search.cycle_radius_by_circulation"
    python_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/src/mixed_sign_coxeter/principal_search.py#L251"
    status: "Verified (Lean 4 + Python)"
    preset: "a_n_alt_4"

  - id: two_defect_cycles
    dissertation_ref: "Two-Defect Cycles C_k(+,+,-,...,-)"
    title: "Two-Defect Cycle Hyperbolicity (All C_n, n ≥ 3)"
    statement: "Every adjacent two-defect cycle C_n(+,+,-,...,-) (n ≥ 3) has spectral radius > 1: odd cycles C_{2m+1} (m ≥ 1) have a real eigenvalue in (-10, -2) via IVT, while even cycles C_{2m} (m ≥ 2) have det(xI - w) = x^{2m} + 3x^{2m-1} + 8 sum_{k=2}^{2m-2} x^k + 3x + 1 and a complex root with ||z|| > 1 (plus non-adjacent C_4, C_5)."
    lean_symbol: "evenCycleAdjTwoDefect_complex_eigenvalue_norm_gt_one"
    lean_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/lean/MixedSignCoxeter/TwoDefectCycle.lean"
    python_ref: "principal_search.cycle_radius_by_circulation"
    python_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/src/mixed_sign_coxeter/principal_search.py#L251"
    status: "Verified (Lean 4 + Python)"
    preset: "a_n_alt_4"
