  - id: open_questions_alternating_square
    dissertation_ref: "Open Qs 2.59, 3.35"
    title: "Alternating Square Non-Conjugacy & Spectral Non-Minimality"
    statement: "On C_4(+,-,+,-), the bipartite principal element has rho = 3 + 2 sqrt(2) and is neither conjugate to the cyclic element nor spectrally minimal."
    lean_symbol: "alternatingSquare_principal_not_conjugate"
    lean_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/lean/MixedSignCoxeter/AlternatingSquare.lean"
