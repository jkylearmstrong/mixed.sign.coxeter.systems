    python_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/src/mixed_sign_coxeter/mixed_sign.py#L200"
    status: "Verified (Lean 4)"
    preset: "a3_ppm"

  - id: theorem_3_9_coxeter_presentation
    dissertation_ref: "Theorem 3.9"
    title: "Classical Coxeter Equivalence (Deletion / Exchange / Coxeter Presentation)"
    statement: "A reflection system is a classical Coxeter system if and only if it satisfies the Deletion Property, if and only if it satisfies the Exchange Property."
    lean_symbol: "theorem_3_9_classical_iff_deletion"
    lean_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/lean/MixedSignCoxeter/ClassicalCoxeterDeletion.lean#L407"
    python_ref: "find_two_deletions"
    python_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/src/mixed_sign_coxeter/group.py#L72"
    status: "Verified (Lean 4)"
    preset: "a_n_alt_4"

  - id: prop_3_10_root_positivity
    dissertation_ref: "Proposition 3.10"
    title: "Positive Roots and Length in Classical Coxeter Systems"
    statement: "If B(e_i, e_i) = 2 and B(e_i, e_j) = -2 cos(pi/m) (m >= 2) or <= -2, then w(e_i) is a positive root iff l(w s_i) > l(w); every root is positive or negative, and W(B) satisfies the Exchange Property, so every classical Coxeter graph gives a Coxeter group."
    lean_symbol: "prop_3_10 / classical_graph_isClassicalCoxeter"
    lean_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/lean/MixedSignCoxeter/RootPositivity.lean#L680"
    python_ref: "verify_prop_3_10"
    python_url: "https://github.com/jkylearmstrong/mixed.sign.coxeter.systems/blob/main/src/mixed_sign_coxeter/group.py#L165"
    status: "Verified (Lean 4 + Python)"
    preset: "e_6_plus"
